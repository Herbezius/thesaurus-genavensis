<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Thesaurus Genavensis · Aperçu des malédictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<style>
 body{background:#15101a;color:#f3eef2}
 .wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:grid;gap:14px;text-align:center}
 .pick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
 .pick button{border:1px solid #5b4a66;background:#2a2230;color:#f3eef2;border-radius:999px;padding:7px 12px;font-size:15px}
 .pick button[aria-pressed=true]{background:#d79bcb;color:#15101a;border-color:#d79bcb}
 a{color:#d79bcb}
</style>
</head>
<body>
<main class="wrap">
 <h1 style="font-size:28px">Aperçu des malédictions</h1>
 <p class="small" style="color:#d9c8e6">Animations provisoires, remplacées automatiquement par les vraies vidéos dès qu'elles sont déposées dans le dossier des vidéos.</p>
 <div class="pick" id="pick"></div>
 <div id="stage"></div>
 <div class="sc-cap" id="sccap"></div>
 <div class="sc-meta"><span id="name"></span><span class="cd" id="cd"></span></div>
 <button class="btn gold" id="replay">Rejouer</button>
 <div class="fact" id="fact"></div>
 <a href="prof.html">Retour à l'espace enseignant</a>
</main>
<script src="data.js"></script>
<script src="scenes.js"></script>
<script>
(() => {
 const { SCENES } = window.TG, $ = s => document.querySelector(s);
 const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
 const q = new URLSearchParams(location.search);
 let cur = q.get('scene') || SCENES[0].id, t0 = Date.now() - (parseFloat(q.get('t')) || 0) * 1000;
 const frozen = q.has('freeze');
 function play(id, at = 0) {
  cur = id; t0 = Date.now() - at * 1000; const sc = SCENES.find(x => x.id === id);
  $('#pick').innerHTML = SCENES.map(x => `<button data-s="${x.id}" aria-pressed="${x.id === id}">${esc(x.nom)}</button>`).join('');
  $('#pick').querySelectorAll('button').forEach(b => b.onclick = () => play(b.dataset.s));
  $('#stage').innerHTML = window.TGScenes.html(id, at);
  $('#name').textContent = sc.nom;
  $('#fact').innerHTML = `<h3>Le savais-tu ?</h3><p>${esc(sc.fact)}</p>${sc.voir ? `<p class="voir">À voir au musée : ${esc(sc.voir)}.</p>` : ''}<h3>Question flash</h3><p>${esc(sc.flash.q)}</p><p class="voir">Réponse : ${esc(sc.flash.ok)} · autres choix : ${sc.flash.bad.map(esc).join(', ')}</p>`;
  if (frozen) document.querySelectorAll('#stage *').forEach(e => e.style.animationPlayState = 'paused');
  tick();
 }
 function tick() {
  const sc = SCENES.find(x => x.id === cur), el = frozen ? (parseFloat(q.get('t')) || 0) : Math.min(sc.dur, (Date.now() - t0) / 1000);
  let txt = ''; for (const [s, c] of sc.captions) if (el >= s) txt = c;
  $('#sccap').textContent = txt; $('#cd').textContent = Math.max(0, Math.ceil(sc.dur - el)) + ' s';
  window.TGScenes.tick(cur, el, document.querySelector('#stage .sc'));
 }
 $('#replay').onclick = () => play(cur);
 setInterval(() => { if (!frozen) tick() }, 100);
 play(cur, parseFloat(q.get('t')) || 0);
})();
</script>
</body>
</html>
